<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300"
     preserveAspectRatio="xMidYMid meet" role="img"
     aria-labelledby="f1CarTitle f1CarDesc">
  <title id="f1CarTitle">Formula 1 car in side view</title>
  <desc id="f1CarDesc">A red Formula 1 single-seater seen from the side, moving to the
    right: front and rear wings, halo, airbox and rotating wheels.</desc>

  <style>
    /*
      Animacja siedzi w samym pliku SVG, nie w arkuszu strony.
      Obrazek jest wstawiany przez &lt;img src&gt;, a taki dokument renderuje sie
      w izolacji — regula z main.css nigdy by tu nie dosiegla.
    */
    @keyframes f1-obrot   { to   { transform: rotate(360deg); } }
    /* Auto jedzie w prawo, wiec powietrze ucieka w lewo — i tak samo smugi. */
    @keyframes f1-pedzi   { 0%   { transform: translateX(90px);   opacity: 0; }
                            20%  { opacity: 1; }
                            100% { transform: translateX(-230px); opacity: 0; } }
    @keyframes f1-drga    { 0%, 100% { transform: translateY(0); }
                            50%      { transform: translateY(-2.5px); } }

    .f1-spokes { animation: f1-obrot 0.55s linear infinite; }
    .f1-car    { animation: f1-drga 1.6s ease-in-out infinite; }

    .f1-speed line { animation: f1-pedzi 1.1s linear infinite; }
    .f1-speed line:nth-child(2) { animation-duration: 0.9s;  animation-delay: 0.15s; }
    .f1-speed line:nth-child(3) { animation-duration: 1.25s; animation-delay: 0.35s; }
    .f1-speed line:nth-child(4) { animation-duration: 0.95s; animation-delay: 0.05s; }
    .f1-speed line:nth-child(5) { animation-duration: 1.15s; animation-delay: 0.5s; }

    /* Ruch jest dekoracja — kto go wylaczyl w systemie, dostaje statyczny obrazek. */
    @media (prefers-reduced-motion: reduce) {
      .f1-spokes,
      .f1-car,
      .f1-speed line {
        animation: none;
      }
      .f1-speed line { opacity: 0.55; }
    }
  </style>

  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#ff2b21"/>
      <stop offset="55%" stop-color="#e10600"/>
      <stop offset="100%" stop-color="#9c0400"/>
    </linearGradient>

    <linearGradient id="sidepod" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#e10600"/>
      <stop offset="100%" stop-color="#8a0300"/>
    </linearGradient>

    <linearGradient id="carbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#3a3f47"/>
      <stop offset="100%" stop-color="#14171c"/>
    </linearGradient>

    <radialGradient id="tyre" cx="50%" cy="42%" r="62%">
      <stop offset="0%"  stop-color="#3b4048"/>
      <stop offset="70%" stop-color="#1c1f24"/>
      <stop offset="100%" stop-color="#0d0f12"/>
    </radialGradient>

    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#f2f4f6"/>
      <stop offset="55%" stop-color="#b9c0c8"/>
      <stop offset="100%" stop-color="#7d858e"/>
    </linearGradient>

    <linearGradient id="visor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#1b2a3a"/>
      <stop offset="100%" stop-color="#42627f"/>
    </linearGradient>

    <!-- Smugi predkosci ciagna sie ZA autem, czyli w lewo: auto jedzie w prawo. -->
    <linearGradient id="smuga" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#e10600" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ff4d45" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- ============ smugi predkosci ============ -->
  <g class="f1-speed" stroke="url(#smuga)" stroke-linecap="round" fill="none">
    <line x1="20"  y1="126" x2="150" y2="126" stroke-width="4"/>
    <line x1="55"  y1="152" x2="205" y2="152" stroke-width="3"/>
    <line x1="10"  y1="182" x2="130" y2="182" stroke-width="5"/>
    <line x1="70"  y1="206" x2="180" y2="206" stroke-width="3"/>
    <line x1="35"  y1="232" x2="165" y2="232" stroke-width="4"/>
  </g>

  <g class="f1-car">

    <!-- ============ tylne skrzydlo ============ -->
    <!--
      Tylne skrzydlo jest w F1 najwyzszym punktem auta i siega niemal szerokosci
      opon. Poprzednia wersja byla za mala i wygladala, jakby unosila sie obok
      nadwozia — teraz pylony schodza az do podlogi.
    -->
    <g>
      <path d="M108 86 h116 a7 7 0 0 1 7 7 v16 a7 7 0 0 1-7 7 h-116 a7 7 0 0 1-7-7 v-16
               a7 7 0 0 1 7-7 z" fill="url(#body)"/>
      <path d="M114 91 h104 v6 h-104 z" fill="#ff6b63" opacity="0.7"/>
      <path d="M118 122 h96 a6 6 0 0 1 6 6 v10 a6 6 0 0 1-6 6 h-96 a6 6 0 0 1-6-6 v-10
               a6 6 0 0 1 6-6 z" fill="#2a2e35"/>
      <!-- pylony schodza do nadwozia, wiec skrzydlo nie wisi w powietrzu -->
      <path d="M146 144 l16 66 h14 l-14-66 z" fill="#23262c"/>
      <path d="M190 144 l16 66 h14 l-14-66 z" fill="#23262c"/>
      <!-- plyty koncowe -->
      <path d="M96 80 h14 a4 4 0 0 1 4 4 v66 a4 4 0 0 1-4 4 h-14 z" fill="#c00500"/>
      <path d="M98 86 h10 v54 h-10 z" fill="#8a0300" opacity="0.5"/>
      <!-- swiatlo deszczowe -->
      <circle cx="128" cy="133" r="4" fill="#ff3b30"/>
    </g>

    <!-- ============ podloga i dyfuzor ============ -->
    <path d="M150 214 h520 l-14 26 h-492 z" fill="url(#carbon)"/>
    <path d="M152 216 h44 v22 h-44 z" fill="#0d0f12"/>
    <path d="M200 216 h10 v22 h-10 z" fill="#0d0f12"/>
    <path d="M214 216 h10 v22 h-10 z" fill="#0d0f12"/>

    <!-- ============ nadwozie: nos, kokpit, osłona silnika ============ -->
    <path d="M690 214
             C 636 216, 596 214, 560 210
             C 540 176, 512 152, 470 140
             L 452 108
             C 448 100, 440 96, 432 96
             L 396 96
             C 388 96, 382 101, 380 109
             L 372 140
             C 352 143, 336 146, 322 150
             L 306 150
             C 296 150, 288 156, 285 165
             L 276 190
             C 250 196, 220 202, 196 210
             L 150 214
             Z" fill="url(#body)"/>

    <!-- boczne chlodnice -->
    <path d="M300 168 C 340 160, 420 156, 470 162
             C 486 178, 500 196, 508 212
             L 292 212 Z" fill="url(#sidepod)"/>
    <path d="M306 172 C 344 166, 412 163, 456 168 L 456 178
             C 412 173, 344 176, 306 182 Z" fill="#14171c" opacity="0.55"/>

    <!-- wlot powietrza nad glowa kierowcy -->
    <path d="M452 108 L 470 140 C 486 144, 500 150, 512 158
             C 500 132, 480 114, 452 108 Z" fill="#1b1e23"/>

    <!-- kokpit: halo, kask, wizjer -->
    <path d="M378 112 C 392 100, 428 100, 444 112" fill="none"
          stroke="#15181d" stroke-width="9" stroke-linecap="round"/>
    <path d="M408 100 L 408 88" stroke="#15181d" stroke-width="7" stroke-linecap="round"/>
    <ellipse cx="411" cy="120" rx="24" ry="19" fill="#f4f6f8"/>
    <path d="M392 118 C 398 108, 420 106, 430 114 L 430 124 L 392 126 Z" fill="url(#visor)"/>

    <!-- numer startowy -->
    <g transform="translate(560 176) rotate(-8)">
      <rect x="-20" y="-16" width="40" height="32" rx="5" fill="#f4f6f8"/>
      <text x="0" y="9" font-family="Arial Black, Arial, sans-serif" font-size="26"
            font-weight="900" text-anchor="middle" fill="#14171c">1</text>
    </g>

    <!-- pasy sponsorskie -->
    <path d="M330 196 h150 v9 h-150 z" fill="#f4f6f8" opacity="0.9"/>
    <path d="M494 152 h34 v7 h-34 z" fill="#f4f6f8" opacity="0.75"/>

    <!-- ============ przednie skrzydlo i nos ============ -->
    <path d="M600 196
             C 640 190, 676 190, 706 194
             C 740 198, 772 202, 800 206
             L 800 224
             C 764 222, 720 220, 686 218
             C 652 216, 620 210, 596 206 Z" fill="url(#body)"/>
    <path d="M604 200 C 648 194, 700 196, 786 208 L 786 213 C 700 202, 648 200, 604 205 Z"
          fill="#ff5a52" opacity="0.55"/>
    <path d="M792 212 l16 22 h10 l-12-22 z" fill="#23262c"/>
    <path d="M770 204 h100 a7 7 0 0 1 7 7 v11 a7 7 0 0 1-7 7 h-100 a7 7 0 0 1-7-7 v-11
             a7 7 0 0 1 7-7 z" fill="url(#body)"/>
    <path d="M776 208 h88 v5 h-88 z" fill="#ff6b63" opacity="0.7"/>
    <path d="M782 232 h82 a5 5 0 0 1 5 5 v7 a5 5 0 0 1-5 5 h-82 a5 5 0 0 1-5-5 v-7
             a5 5 0 0 1 5-5 z" fill="#2a2e35"/>
    <path d="M790 252 h66 a4 4 0 0 1 4 4 v5 a4 4 0 0 1-4 4 h-66 a4 4 0 0 1-4-4 v-5
             a4 4 0 0 1 4-4 z" fill="#1b1e23"/>
    <!-- plyta koncowa -->
    <path d="M866 194 h16 a4 4 0 0 1 4 4 v72 a4 4 0 0 1-4 4 h-16 z" fill="#c00500"/>
    <path d="M868 200 h12 v58 h-12 z" fill="#8a0300" opacity="0.5"/>

    <!-- ============ kola ============ -->
    <!-- tylne -->
    <g class="f1-wheel f1-wheel--rear">
      <circle cx="250" cy="214" r="62" fill="url(#tyre)"/>
      <circle cx="250" cy="214" r="62" fill="none" stroke="#0a0c0f" stroke-width="3"/>
      <circle cx="250" cy="214" r="40" fill="url(#rim)"/>
      <g class="f1-spokes" style="transform-origin: 250px 214px">
        <g stroke="#7d858e" stroke-width="5" stroke-linecap="round">
          <line x1="250" y1="180" x2="250" y2="248"/>
          <line x1="216" y1="214" x2="284" y2="214"/>
          <line x1="226" y1="190" x2="274" y2="238"/>
          <line x1="226" y1="238" x2="274" y2="190"/>
        </g>
        <circle cx="250" cy="214" r="10" fill="#e10600"/>
      </g>
      <!-- pasek na bieznikuu, zeby obrot byl widoczny -->
      <g class="f1-spokes" style="transform-origin: 250px 214px">
        <path d="M250 152 v10" stroke="#f4f6f8" stroke-width="4" opacity="0.65"/>
      </g>
    </g>

    <!-- przednie -->
    <g class="f1-wheel f1-wheel--front">
      <circle cx="700" cy="216" r="58" fill="url(#tyre)"/>
      <circle cx="700" cy="216" r="58" fill="none" stroke="#0a0c0f" stroke-width="3"/>
      <circle cx="700" cy="216" r="37" fill="url(#rim)"/>
      <g class="f1-spokes" style="transform-origin: 700px 216px">
        <g stroke="#7d858e" stroke-width="5" stroke-linecap="round">
          <line x1="700" y1="185" x2="700" y2="247"/>
          <line x1="669" y1="216" x2="731" y2="216"/>
          <line x1="678" y1="194" x2="722" y2="238"/>
          <line x1="678" y1="238" x2="722" y2="194"/>
        </g>
        <circle cx="700" cy="216" r="9" fill="#e10600"/>
      </g>
      <g class="f1-spokes" style="transform-origin: 700px 216px">
        <path d="M700 158 v10" stroke="#f4f6f8" stroke-width="4" opacity="0.65"/>
      </g>
    </g>

    <!-- zawieszenie -->
    <g stroke="#23262c" stroke-width="7" stroke-linecap="round" fill="none">
      <path d="M292 200 L 250 214"/>
      <path d="M300 178 L 250 208"/>
      <path d="M660 204 L 700 216"/>
      <path d="M652 186 L 700 210"/>
    </g>

    <!-- lusterko -->
    <path d="M470 132 l22-6 4 10 -22 6 z" fill="#1b1e23"/>
  </g>
</svg>
